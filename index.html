<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspecciones y Reparaciones</title>
  
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1063/1063376.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1063/1063376.png">

  <style>
    :root{
      --bg:#0b0f14; --text:#e8eef7; --muted:#a6b3c3; --line:rgba(255,255,255,.08);
      --accent:#4aa3ff; --danger:#ff4a6a; --ok:#3be3a1;
      --shadow: 0 10px 30px rgba(0,0,0,.35); --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 30% -10%, rgba(74,163,255,.25), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(59,227,161,.18), transparent 55%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(11,15,20,.65);
      border-bottom:1px solid var(--line);
    }
    .wrap{ max-width:1100px; margin:0 auto; padding:18px 14px; }
    .topbar{ display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap; }
    .brand{ display:flex; align-items:center; gap:12px; min-width:260px; }
    .logo{
      width:42px;height:42px;border-radius:14px;
      background: linear-gradient(135deg, rgba(74,163,255,.95), rgba(59,227,161,.9));
      box-shadow: var(--shadow);
    }
    .brand h1{ margin:0; font-size:16px; letter-spacing:.2px; }
    .brand p{ margin:2px 0 0; color:var(--muted); font-size:12px; }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .btn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .05s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ background: rgba(74,163,255,.18); border-color: rgba(74,163,255,.35); }
    .btn.danger{ background: rgba(255,74,106,.14); border-color: rgba(255,74,106,.35); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }

    main .grid{ display:grid; grid-template-columns: 1.1fr .9fr; gap:14px; padding:16px 0 26px; }
    @media (max-width: 900px){ main .grid{ grid-template-columns: 1fr; } }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel .hd{
      padding:14px 14px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel .hd .title{ display:flex; flex-direction:column; gap:4px; }
    .panel .hd .title h2{ margin:0; font-size:14px; }
    .panel .hd .title span{ color:var(--muted); font-size:12px; }
    .panel .bd{ padding:14px; }

    label{ display:block; font-size:12px; color:var(--muted); margin:10px 0 6px; }
    input[type="text"], input[type="date"], textarea{
      width:100%;
      background: rgba(255,255,255,.04);
      border:1px solid var(--line);
      color:var(--text);
      border-radius:14px;
      padding:11px 12px;
      outline:none;
      transition: border-color .2s ease, background .2s ease;
    }
    textarea{ min-height:94px; resize: vertical; }
    input:focus, textarea:focus{
      border-color: rgba(74,163,255,.5);
      background: rgba(255,255,255,.06);
    }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 520px){ .row{ grid-template-columns: 1fr; } }

    .hint{ color:var(--muted); font-size:12px; margin-top:8px; line-height:1.35; }

    .drop{
      border: 1px dashed rgba(255,255,255,.22);
      background: rgba(255,255,255,.03);
      padding:14px;
      border-radius: 16px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:flex-start;
    }

    .thumbs{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:8px;
      width:100%;
    }
    @media (max-width: 520px){ .thumbs{ grid-template-columns: repeat(3, 1fr); } }
    .thumb{
      position:relative;
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      aspect-ratio: 1/1;
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumb button{
      position:absolute; top:6px; right:6px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.45);
      color:var(--text);
      border-radius: 12px;
      padding:6px 8px;
      cursor:pointer;
      font-size:12px;
    }

    .savebar{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; justify-content:space-between; }

    .toast{
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17,27,40,.92);
      border:1px solid var(--line);
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 13px;
      display:none;
      gap:10px;
      align-items:center;
      z-index: 50;
      max-width: calc(100vw - 24px);
    }
    .dot{ width:10px; height:10px; border-radius:999px; background: var(--accent); }

    .searchBox{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; width:100%; }
    .searchBox input{ flex:1; min-width: 200px; }
    .chips{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      padding:8px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      display:flex; align-items:center; gap:8px;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      color: var(--text);
      border-color: rgba(74,163,255,.38);
      background: rgba(74,163,255,.12);
    }

    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 18px;
      overflow:hidden;
    }
    .itemHd{
      padding:12px 12px 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      border-bottom:1px solid rgba(255,255,255,.06);
      flex-wrap:wrap;
    }
    .meta{ display:flex; flex-direction:column; gap:4px; }
    .meta strong{ font-size:13px; }
    .meta small{ color:var(--muted); font-size:12px; }
    .itemHd .tools{ display:flex; gap:8px; flex-wrap:wrap; }

    .miniBtn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding:8px 10px;
      border-radius: 12px;
      cursor:pointer;
      font-size:12px;
    }
    .miniBtn:hover{ background: rgba(255,255,255,.07); }
    .miniBtn.danger{
      border-color: rgba(255,74,106,.32);
      background: rgba(255,74,106,.12);
    }

    .gallery{
      padding:12px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:8px;
    }
    @media (max-width: 900px){ .gallery{ grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 520px){ .gallery{ grid-template-columns: repeat(2, 1fr); } }

    .gimg{
      border-radius: 14px;
      overflow:hidden;
      border:1px solid var(--line);
      background: rgba(255,255,255,.02);
      aspect-ratio: 1 / 1;
      cursor:pointer;
    }
    .gimg img{ width:100%; height:100%; object-fit:cover; display:block; }

    .empty{
      padding:14px;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .modal{
      position:fixed; inset:0;
      background: rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:80;
    }
    .modalCard{
      width:min(920px, 100%);
      background: rgba(15,22,32,.96);
      border:1px solid var(--line);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }
    .modalTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .modalTop strong{ font-size:13px; }
    .modalTop button{
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding:8px 10px;
      border-radius: 12px;
      cursor:pointer;
    }
    .modalBody{
      padding:12px;
      display:flex;
      justify-content:center;
      background: rgba(0,0,0,.18);
    }
    .modalBody img{
      width:100%;
      height:auto;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.02);
    }
    .footerNote{
      padding: 0 14px 18px;
      color: var(--muted);
      font-size: 12px;
      max-width:1100px;
      margin: 0 auto;
    }
    .modePill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px; font-size:12px;
      border:1px solid var(--line); background: rgba(255,255,255,.03);
      color: var(--muted);
    }
    .modePill b{ color: var(--text); font-weight:600; }
    .photoActions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .exportBar{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  </style>
  
  <script>
    const manifest = {
      "name": "Inspecciones Irrigación",

      "theme_color": "#0b0f14",

    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);

<script>
// --- Lógica de la Base de Datos ---
const DB_NAME = "inspecciones_irrigacion_db";
const DB_VER  = 13;
let db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const d = req.result;
      let records;
      if(!d.objectStoreNames.contains("records")){
        records = d.createObjectStore("records", { keyPath: "id" });
      }else{
        records = req.transaction.objectStore("records");
      }
      if(!records.indexNames.contains("createdAt")) records.createIndex("createdAt", "createdAt", { unique:false });
      if(!records.indexNames.contains("tecnicoNorm_createdAt")) records.createIndex("tecnicoNorm_createdAt", ["tecnicoNorm", "createdAt"], { unique:false });
      if(!records.indexNames.contains("propiedadNorm_createdAt")) records.createIndex("propiedadNorm_createdAt", ["propiedadNorm", "createdAt"], { unique:false });
      if(!records.indexNames.contains("fecha_createdAt")) records.createIndex("fecha_createdAt", ["fecha", "createdAt"], { unique:false });
      if(!records.indexNames.contains("propiedadTokens")) records.createIndex("propiedadTokens", "propiedadTokens", { unique:false, multiEntry:true });
      if(!d.objectStoreNames.contains("images")){
        const images = d.createObjectStore("images", { keyPath: "key" });
        images.createIndex("recordId", "recordId", { unique:false });
      }
      if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta", { keyPath: "key" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(storeNames, mode="readonly"){
  const t = db.transaction(storeNames, mode);
  return { t, store:(name)=>t.objectStore(name) };
}
function idbGet(storeName, key){
  return new Promise((resolve, reject)=>{
    const {store} = tx([storeName], "readonly");
    const req = store(storeName).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbPut(storeName, value){
  return new Promise((resolve, reject)=>{
    const {store} = tx([storeName], "readwrite");
    const req = store(storeName).put(value);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function idbDelete(storeName, key){
  return new Promise((resolve, reject)=>{
    const {store} = tx([storeName], "readwrite");
    const req = store(storeName).delete(key);
    req.onsuccess = ()=> resolve(true);
    req.onerror = ()=> reject(req.error);
  });
}
function idbClear(storeName){
  return new Promise((resolve, reject)=>{
    const {store} = tx([storeName], "readwrite");
    const req = store(storeName).clear();
    req.onsuccess = ()=> resolve(true);
    req.onerror = ()=> reject(req.error);
  });
}
function idbGetAllByIndex(storeName, indexName, value){
  return new Promise((resolve, reject)=>{
    const {store} = tx([storeName], "readonly");
    const idx = store(storeName).index(indexName);
    const req = idx.getAll(value);
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}

const $ = (sel)=>document.querySelector(sel);
const $$ = (sel)=>Array.from(document.querySelectorAll(sel));

function toast(msg, ok=true){
  const el = $("#toast");
  $("#toastMsg").textContent = msg;
  el.style.display = "flex";
  el.querySelector(".dot").style.background = ok ? "var(--ok)" : "var(--danger)";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.style.display="none", 2600);
}
function normalize(s){
  return (s||"").toString().normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase().trim();
}
function tokensFromPropiedad(prop){
  const s = normalize(prop);
  if(!s) return [];
  return s.split(/\s+/).filter(Boolean);
}
function uid(){ return "id_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16); }
function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function safeFolderName(propiedad, fecha, tecnico){
  const p=(propiedad||"SinPropiedad").trim();
  const f=(fecha||"SinFecha").trim();
  const t=(tecnico||"SinTecnico").trim();
  return `${p}__${f}__${t}`.replace(/[\/\\:*?"<>|]+/g,"-").replace(/\s+/g," ").trim();
}
function updateFolder(){ $("#carpeta").value = safeFolderName($("#propiedad").value, $("#fecha").value, $("#tecnico").value); }
function escapeHtml(str){ return (str||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function shorten(s, n){ s=(s||"").trim(); return s.length>n ? s.slice(0,n-1)+"…" : s; }
function activeSearchKeys(){
  const keys = {};
  $$("#chips .chip").forEach(c=> keys[c.dataset.key] = c.classList.contains("active"));
  return keys;
}

// --- Gestión de Borradores (Drafts) ---
let editRecordId = null;
let editOriginalImageIds = new Set();
let draftImages = [];
let thumbUrls = new Map();

async function saveDraftNow(){
  try{
    const draft = {
      propiedad: $("#propiedad").value.trim(),
      tecnico: $("#tecnico").value.trim(),
      fecha: $("#fecha").value.trim(),
      descripcion: $("#descripcion").value.trim(),
      carpeta: $("#carpeta").value.trim(),
      images: draftImages.map(x=>({imageId:x.imageId, name:x.name, type:x.type})),
      savedAt: new Date().toISOString(),
      editRecordId
    };
    await idbPut("meta", { key:"draft", value:draft });
    $("#draftStatus").textContent = new Date(draft.savedAt).toLocaleTimeString();
  }catch(e){ console.error(e); }
}

async function restoreDraftToForm(){
  const d = await idbGet("meta", "draft");
  if(!d || !d.value) return;
  const v = d.value;
  $("#propiedad").value = v.propiedad || "";
  $("#tecnico").value = v.tecnico || "";
  $("#fecha").value = v.fecha || "";
  $("#descripcion").value = v.descripcion || "";
  updateFolder();
  editRecordId = v.editRecordId || null;
  $("#modeText").textContent = editRecordId ? "EDICIÓN" : "NUEVO";
  const blobs = await idbGetAllByIndex("images", "recordId", "draft");
  const byId = new Map(blobs.map(b=>[b.imageId, b]));
  draftImages = (v.images||[]).map(m=>{
    const f = byId.get(m.imageId);
    return f ? { imageId:f.imageId, name:f.name, type:f.type, blob:f.blob } : null;
  }).filter(Boolean);
  renderThumbs();
}

function renderThumbs(){
  const wrap=$("#thumbs"); wrap.innerHTML="";
  for(const url of thumbUrls.values()) URL.revokeObjectURL(url);
  thumbUrls.clear();
  draftImages.forEach(img=>{
    const url = URL.createObjectURL(img.blob);
    thumbUrls.set(img.imageId, url);
    const div=document.createElement("div");
    div.className="thumb";
    div.innerHTML = `<img src="${url}"><button>✕</button>`;
    div.querySelector("button").onclick = async ()=>{
      draftImages = draftImages.filter(x=>x.imageId !== img.imageId);
      await idbDelete("images", `draft:${img.imageId}`);
      renderThumbs();
      saveDraftNow();
    };
    wrap.appendChild(div);
  });
}

// --- Motor ZIP Simplificado ---
const Zip = (() => {
  function u16(v){ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,v,true); return b; }
  function u32(v){ const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,v,true); return b; }
  function concat(arrs){
    let len=0; for(const a of arrs) len+=a.length;
    const out=new Uint8Array(len); let off=0;
    for(const a of arrs){ out.set(a,off); off+=a.length; }
    return out;
  }
  return {
    zipStore: (files) => {
      let local=[], central=[], offset=0;
      for(const f of files){
        const name=new TextEncoder().encode(f.name);
        const header=concat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(0),u32(f.data.length),u32(f.data.length),u16(name.length),u16(0),name]);
        local.push(header, f.data);
        central.push(concat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(0),u32(f.data.length),u32(f.data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]));
        offset+=header.length+f.data.length;
      }
      const cdir=concat(central), eocd=concat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdir.length),u32(offset),u16(0)]);
      return concat([...local,cdir,eocd]);
    }
  };
})();

// --- Guardar Registro ---
async function saveCreateOrUpdate(){
  const p=$("#propiedad").value.trim(), t=$("#tecnico").value.trim(), f=$("#fecha").value.trim(), d=$("#descripcion").value.trim();
  if(!p || !t || !f || draftImages.length===0) return toast("Faltan datos", false);

  const isEdit = !!editRecordId;
  const recordId = isEdit ? editRecordId : uid();
  const record = {
    id: recordId, propiedad:p, tecnico:t, fecha:f, descripcion:d,
    propiedadNorm: normalize(p), tecnicoNorm: normalize(t),
    propiedadTokens: tokensFromPropiedad(p),
    createdAt: isEdit ? (await idbGet("records", recordId)).createdAt : new Date().toISOString(),
    images: draftImages.map(x=>({imageId:x.imageId, name:x.name, type:x.type}))
  };

  await idbPut("records", record);
  for(const img of draftImages){
    await idbPut("images", { key:`${recordId}:${img.imageId}`, recordId, imageId:img.imageId, name:img.name, blob:img.blob });
  }

  toast(isEdit ? "Actualizado" : "Guardado");
  $("#btnNuevo").click();
  showTodayRecords();
}

// --- Listado y Búsqueda ---
async function showTodayRecords(){
  const today = todayISO();
  const {store} = tx(["records"]);
  const all = await new Promise(r => {
    store("records").index("fecha_createdAt").getAll(IDBKeyRange.bound([today, ""], [today, "\uffff"])).onsuccess = e => r(e.target.result);
  });
  const list = $("#list"); list.innerHTML = all.length ? "" : '<div class="empty">No hay registros hoy</div>';
  all.reverse().forEach(rec => {
    const item = document.createElement("div");
    item.className = "item";
    item.innerHTML = `<div class="itemHd"><div class="meta"><strong>${rec.propiedad}</strong><small>${rec.fecha} · ${rec.images.length} fotos</small></div><button class="miniBtn" onclick="loadRecord('${rec.id}')">Editar</button></div>`;
    list.appendChild(item);
  });
}

window.loadRecord = async (id) => {
  const rec = await idbGet("records", id);
  if(!rec) return;
  editRecordId = id;
  $("#propiedad").value = rec.propiedad;
  $("#tecnico").value = rec.tecnico;
  $("#fecha").value = rec.fecha;
  $("#descripcion").value = rec.descripcion;
  $("#modeText").textContent = "EDICIÓN";
  const imgs = await idbGetAllByIndex("images", "recordId", id);
  draftImages = imgs.map(i => ({imageId:i.imageId, name:i.name, blob:i.blob}));
  renderThumbs();
  window.scrollTo(0,0);
};

// --- Eventos ---
function wireEvents(){
  $("#btnGuardar").onclick = saveCreateOrUpdate;
  $("#btnNuevo").onclick = async () => {
    editRecordId = null; $("#modeText").textContent = "NUEVO";
    $("#propiedad").value = ""; $("#tecnico").value = ""; $("#descripcion").value = "";
    $("#fecha").value = todayISO(); draftImages = []; renderThumbs();
    await idbDelete("meta", "draft");
  };
  $("#btnAgregarFotos").onclick = () => $("#fotosGaleria").click();
  $("#btnTomarFoto").onclick = () => $("#fotosCamara").click();
  
  const handleFiles = async (files) => {
    for(const f of files){
      const id = uid();
      draftImages.push({imageId:id, name:f.name, blob:f});
      await idbPut("images", {key:`draft:${id}`, recordId:"draft", imageId:id, blob:f});
    }
    renderThumbs(); saveDraftNow();
  };
  
  $("#fotosGaleria").onchange = (e) => handleFiles(e.target.files);
  $("#fotosCamara").onchange = (e) => handleFiles(e.target.files);

  $("#btnWhatsAppLote").onclick = async () => {
    const records = await new Promise(r => tx(["records"]).store("records").getAll().onsuccess = e => r(e.target.result));
    if(!records.length) return toast("Nada que enviar", false);
    const zipBytes = Zip.zipStore(records.map(r => ({name: `${r.propiedad}.json`, data: new TextEncoder().encode(JSON.stringify(r))})));
    const file = new File([zipBytes], `inspecciones_${todayISO()}.zip`, {type:"application/zip"});
    if(navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({title:"Lote Inspecciones", files:[file]});
    } else {
      const url = URL.createObjectURL(file);
      const a = document.createElement("a"); a.href=url; a.download=file.name; a.click();
      toast("ZIP descargado. Adjúntalo en WhatsApp.");
    }
  };
}

// --- Inicialización y Registro PWA ---
(async () => {
  db = await openDB();
  await restoreDraftToForm();
  if(!$("#fecha").value) $("#fecha").value = todayISO();
  wireEvents();
  showTodayRecords();

  // Registro del Service Worker dinámico
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const swBlob = new Blob([swCode], {type: 'application/javascript'});
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }
})();
</script>
